name: ClickAI
options:
  bundleIdPrefix: com.lionsgroup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "XCODE_BUILD"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  ClickAI:
    type: application
    platform: iOS
    sources:
      - path: ClickAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lionsgroup.clickai
        PRODUCT_NAME: CLICK
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: CLICK AI Coach
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна для распознавания продуктов, этикеток и блюд."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Доступ к фото нужен для распознавания еды и сравнения прогресса."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Apple Health нужен для импорта веса, шагов и тренировок с вашего разрешения."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "CLICK может сохранять тренировки и показатели в Apple Health с вашего разрешения."
        DEVELOPMENT_ASSET_PATHS: ""
    scheme:
      testTargets: []
      gatherCoverageData: false

